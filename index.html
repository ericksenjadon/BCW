<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BCW Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  /* Layout concept: black broadcast nav, a slim stats band, then bordered dashboard cards in two rows (two wide cards, then four tall ones) with a green outline glow. Gold marks names and champions. */
  :root {
    --bg: #090c0a;
    --card: #040605;
    --panel: #121713;
    --panel2: #1a211b;
    --line: #29322b;
    --fg: #f1f5f1;
    --muted: #9aa79c;
    --accent: #22c55e;
    --accentfg: #04130a;
    --gold: #f5c518;
    --nav: #040605;
    --navfg: #f1f5f1;
    --heel: #f2685b;
    --face: #4cc3ff;
    --tween: #f5b73d;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2ed; --card: #ffffff; --panel: #ffffff; --panel2: #e6ece5; --line: #cfd8cd;
      --fg: #0f1511; --muted: #526055; --accent: #15803d; --accentfg: #ffffff; --gold: #946200;
      --heel: #c2362a; --face: #0a74b8; --tween: #a8680a;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef2ed; --card: #ffffff; --panel: #ffffff; --panel2: #e6ece5; --line: #cfd8cd;
    --fg: #0f1511; --muted: #526055; --accent: #15803d; --accentfg: #ffffff; --gold: #946200;
    --heel: #c2362a; --face: #0a74b8; --tween: #a8680a;
    color-scheme: light;
  }
  body { background-color: var(--bg); background-image: radial-gradient(ellipse 70% 40% at 50% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent); background-repeat: no-repeat; color: var(--fg); font-family: var(--font-body); font-size: 16px; margin: 0; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cap { max-width: 1480px; margin-left: auto; margin-right: auto; }
  .card { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; box-shadow: 0 0 36px color-mix(in srgb, var(--accent) 14%, transparent); }
  .stripes { background-image: repeating-linear-gradient(115deg, transparent 0 26px, color-mix(in srgb, var(--accent) 12%, transparent) 26px 30px); }
  .noscroll { scrollbar-width: none; }
  .noscroll::-webkit-scrollbar { display: none; }
  .slim { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 0.28s ease-out both; }
</style>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { bg: "var(--bg)", card: "var(--card)", panel: "var(--panel)", panel2: "var(--panel2)", line: "var(--line)", fg: "var(--fg)", muted: "var(--muted)", accent: "var(--accent)", accentfg: "var(--accentfg)", gold: "var(--gold)", nav: "var(--nav)", navfg: "var(--navfg)", heel: "var(--heel)", face: "var(--face)", tween: "var(--tween)" },
      fontFamily: { display: "var(--font-display)", body: "var(--font-body)", mono: "var(--font-mono)" }
    } }
  };
</script>

</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;
const { ROSTER, TITLES, TITLE_DETAILS, RANKINGS, STORIES } = window.BCW;

const ALIGN = { heel: "Heel", face: "Face", tween: "Tween" };
const NAV = [["Home", "index.html"], ["Roster", "roster.html"], ["Titles", "roster.html#titles"], ["Rankings", "#rankings"], ["Stories", "#stories"], ["Calendar", "#events"]];
const STREAMS = [
  ["BCW Network", "Every premium live event, plus the full archive, on any device."],
  ["Arena+", "Weekly shows live in your region with replays for 30 days."],
  ["How to Watch", "Find where each show and event streams in your country."],
];
const FOOT = {
  Corporate: ["Corporate", "Careers", "Impact"],
  "BCW.com": ["News", "Videos", "Photos", "Priority Pass"],
  About: ["Terms of Use", "Privacy Policy", "Copyright", "Your Privacy Choices"],
  Help: ["Club FAQs", "Contact Us", "Security", "Cookie Policy"],
};
const STORE_KEY = "bcw-special-events";

/* ---------- Helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = (s) => new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const loadEvents = () => { try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const saveEvents = (list) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) {} };

/* ---------- Icons ---------- */
const Icon = ({ d, size = 20, className = "", fill = "none" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true"><path d={d} /></svg>
);
const I = {
  menu: "M4 6h16M4 12h16M4 18h16",
  close: "M18 6 6 18M6 6l12 12",
  right: "M9 18l6-6-6-6",
  left: "M15 18l-6-6 6-6",
  arrow: "M5 12h14M13 6l6 6-6 6",
  down: "M6 9l6 6 6-6",
  sun: "M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  play: "M6 4l14 8-14 8z",
  trash: "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6",
  cal: "M3 5h18v16H3zM3 10h18M8 3v4M16 3v4",
};

/* ---------- Shared pieces ---------- */
function AlignPill({ a }) {
  return <span className={`inline-block border px-2 py-0.5 font-display text-sm font-bold uppercase tracking-wider text-${a} border-${a}`}>{ALIGN[a]}</span>;
}

function Card({ id, title, children, footer, className = "" }) {
  return (
    <section id={id} aria-labelledby={`${id}-h`} className={`card scroll-mt-24 flex flex-col p-5 sm:p-7 min-w-0 ${className}`}>
      <h2 id={`${id}-h`} className="font-display text-3xl sm:text-[2rem] font-bold uppercase tracking-[0.14em] leading-tight">{title}</h2>
      <span className="block mt-3 mb-5 h-[3px] w-12 bg-accent" aria-hidden="true" />
      <div className="flex-1 min-h-0 flex flex-col">{children}</div>
      {footer && <div className="mt-5 pt-4 border-t border-line">{footer}</div>}
    </section>
  );
}

function GoLink({ href, onClick, children }) {
  const cls = "inline-flex items-center gap-1.5 text-sm font-medium text-fg hover:text-accent transition-colors group";
  const inner = <>{children}<Icon d={I.arrow} size={16} className="transition-transform group-hover:translate-x-1" /></>;
  return href ? <a href={href} className={cls}>{inner}</a> : <button onClick={onClick} className={cls}>{inner}</button>;
}

/* ---------- Header ---------- */
function Header({ onToggleTheme }) {
  const [menu, setMenu] = useState(false);
  const [watch, setWatch] = useState(false);
  const watchRef = useRef(null);
  useEffect(() => {
    if (!watch) return;
    const close = (e) => { if (watchRef.current && !watchRef.current.contains(e.target)) setWatch(false); };
    const esc = (e) => { if (e.key === "Escape") setWatch(false); };
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, [watch]);
  return (
    <header className="sticky z-50 bg-nav text-navfg border-b border-line" style={{ top: "env(safe-area-inset-top, 0px)" }}>
      <div className="gut">
        <div className="cap flex h-16 items-center gap-4">
          <button className="lg:hidden -ml-2 p-2 rounded hover:bg-white/10 transition-colors" aria-label={menu ? "Close menu" : "Open menu"} aria-expanded={menu} onClick={() => setMenu(!menu)}>
            <Icon d={menu ? I.close : I.menu} size={24} />
          </button>
          <a href="index.html" className="flex items-center gap-2 font-display text-[2.1rem] font-extrabold tracking-wide leading-none" aria-label="BCW home">
            <span className="inline-block h-6 w-2.5 -skew-x-12 bg-accent" aria-hidden="true" />BCW
          </a>
          <nav aria-label="Main" className="hidden lg:flex items-center gap-1 ml-6">
            {NAV.map(([n, href]) => {
              const on = n === "Home";
              return (
                <a key={n} href={href} aria-current={on ? "page" : undefined}
                  className={`relative px-3 py-2 font-display text-lg font-semibold uppercase tracking-wide transition-colors hover:text-accent ${on ? "text-accent" : ""}`}>
                  {n}
                  {on && <span className="absolute left-3 right-3 -bottom-[13px] h-[3px] bg-accent" />}
                </a>
              );
            })}
          </nav>
          <div className="ml-auto flex items-center gap-1 sm:gap-2">
            <div className="relative" ref={watchRef}>
              <button onClick={() => setWatch(!watch)} aria-expanded={watch} aria-haspopup="true"
                className="flex items-center gap-1.5 rounded-sm bg-accent text-accentfg px-3 sm:px-4 py-2 font-display font-bold uppercase tracking-wide text-base hover:brightness-110 active:brightness-90 transition">
                <Icon d={I.play} size={14} fill="currentColor" /> Watch <Icon d={I.down} size={16} className={`transition-transform ${watch ? "rotate-180" : ""}`} />
              </button>
              {watch && (
                <div className="rise absolute right-0 mt-3 w-[min(92vw,22rem)] bg-panel text-fg border border-line shadow-2xl rounded-sm p-2">
                  {STREAMS.map(([t, d]) => (
                    <a key={t} href="#" onClick={(e) => e.preventDefault()} className="block p-3 rounded-sm hover:bg-panel2 focus-visible:bg-panel2 transition-colors">
                      <span className="block font-display text-xl font-bold uppercase">{t}</span>
                      <span className="block text-sm text-muted">{d}</span>
                    </a>
                  ))}
                </div>
              )}
            </div>
            <button onClick={onToggleTheme} aria-label="Switch light or dark theme" className="p-2 rounded hover:bg-white/10 transition-colors hover:text-accent"><Icon d={I.sun} size={22} /></button>
          </div>
        </div>
      </div>
      {menu && (
        <nav aria-label="Mobile" className="lg:hidden border-t border-line bg-nav rise">
          <div className="gut">
            <ul className="cap py-2">
              {NAV.map(([n, href]) => (
                <li key={n}>
                  <a href={href} onClick={() => setMenu(false)} className={`flex items-center justify-between py-3 border-b border-line font-display text-2xl font-semibold uppercase ${n === "Home" ? "text-accent" : ""}`}>
                    {n}<Icon d={I.right} size={18} />
                  </a>
                </li>
              ))}
            </ul>
          </div>
        </nav>
      )}
    </header>
  );
}

/* ---------- Stats band ---------- */
function Band({ upcoming }) {
  const holders = new Set(TITLES.flatMap((t) => t.holders)).size;
  const stats = [[ROSTER.length, "Competitors"], [holders, "Champions"], [STORIES.filter((s) => s.status === "Active").length, "Active stories"], [upcoming, "Upcoming events"]];
  return (
    <section className="stripes border-b border-line bg-panel">
      <div className="gut">
        <div className="cap py-8 sm:py-10 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p className="font-display text-lg font-semibold uppercase tracking-[0.2em] text-accent">Welcome to BCW</p>
            <h1 className="font-display text-5xl sm:text-7xl font-extrabold uppercase leading-[0.9] tracking-tight">Home</h1>
          </div>
          <div className="grid grid-cols-2 sm:flex gap-x-8 gap-y-3 font-display uppercase">
            {stats.map(([n, l]) => (
              <div key={l}>
                <p className="text-4xl sm:text-5xl font-extrabold leading-none tabular-nums">{n}</p>
                <p className="text-sm tracking-widest text-muted">{l}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- Top row ---------- */
function RosterSnapshot() {
  return (
    <Card id="snapshot" title="Roster Snapshot" footer={<GoLink href="roster.html#roster">Go to Roster</GoLink>}>
      <ul className="divide-y divide-line">
        {ROSTER.map((p) => (
          <li key={p.id}>
            <a href="roster.html#roster" className="group flex items-center gap-3 sm:gap-4 py-3 hover:bg-panel2 transition-colors">
              <span className="grid place-items-center h-11 w-11 shrink-0 rounded-full font-display text-2xl font-extrabold text-white" style={{ background: `linear-gradient(160deg, hsl(${p.hue} 45% 32%), hsl(${p.hue} 50% 10%))` }}>{p.name[0]}</span>
              <span className="min-w-0 flex-1">
                <span className="block font-display text-2xl font-bold uppercase leading-none text-gold group-hover:text-accent transition-colors truncate">{p.name}</span>
                <span className="block mt-0.5 text-sm text-muted tabular-nums">{p.record.w}W {p.record.l}L {p.record.d}D</span>
              </span>
              <AlignPill a={p.alignment} />
              <span className="w-14 text-right font-mono font-bold tabular-nums">{p.winRate}%</span>
            </a>
          </li>
        ))}
      </ul>
    </Card>
  );
}

function Divisions() {
  const groups = useMemo(() => {
    const map = {};
    ROSTER.forEach((p) => p.ranked.forEach((r) => {
      (map[r.division] = map[r.division] || { division: r.division, title: r.title, entries: [] }).entries.push({ rank: r.rank, name: p.name });
    }));
    return Object.values(map).map((g) => ({ ...g, entries: g.entries.sort((a, b) => a.rank - b.rank) }));
  }, []);
  return (
    <Card id="divisions" title="Ranked Divisions" footer={<GoLink href="roster.html#titles">Go to Titles</GoLink>}>
      <div className="grid gap-4 sm:grid-cols-2">
        {groups.map((g) => (
          <div key={g.division} className="border border-line p-4 rounded-lg bg-panel">
            <h3 className="font-display text-2xl font-bold uppercase leading-tight">{g.division}</h3>
            <p className="text-sm text-muted mb-3">{g.title}</p>
            <ol className="space-y-1.5">
              {g.entries.map((e) => (
                <li key={e.name} className="flex items-center gap-3">
                  <span className="grid place-items-center h-8 w-10 bg-accent text-accentfg font-display text-xl font-extrabold tabular-nums">#{e.rank}</span>
                  <span className="font-display text-2xl font-bold text-gold">{e.name}</span>
                </li>
              ))}
            </ol>
          </div>
        ))}
      </div>
    </Card>
  );
}

/* ---------- Bottom row ---------- */
function Champions() {
  const held = TITLES.filter((t) => t.holders.length > 0);
  return (
    <Card id="champions" title="Current Champions" footer={<GoLink href="roster.html#titles">Go to Titles</GoLink>}>
      <ul className="slim max-h-[26rem] overflow-y-auto space-y-3 pr-1">
        {held.map((t) => {
          const d = TITLE_DETAILS[t.name];
          return (
            <li key={t.name} className="border border-line rounded-lg bg-panel p-4">
              <h3 className="font-display text-2xl font-bold leading-tight">{t.name}</h3>
              <p className="mt-1 font-display text-2xl font-bold text-gold leading-tight">{t.holders.join(" & ")}</p>
              {d && (
                <dl className="mt-3 flex flex-wrap gap-x-8 gap-y-1 text-sm">
                  <div><dt className="inline text-muted">Reign: </dt><dd className="inline font-medium tabular-nums">{d.reign}</dd></div>
                  <div><dt className="inline text-muted">Last Defense: </dt><dd className="inline font-medium">{d.lastDefense}</dd></div>
                </dl>
              )}
            </li>
          );
        })}
      </ul>
    </Card>
  );
}

function Rankings() {
  const rows = RANKINGS.slice().sort((a, b) => a.rank - b.rank);
  return (
    <Card id="rankings" title="Top 10 Rankings" footer={<GoLink href="roster.html#roster">Go to Roster</GoLink>}>
      <ol className="slim max-h-[26rem] overflow-y-auto pr-1">
        {rows.map((r) => (
          <li key={r.rank} className="flex items-baseline gap-3 py-3.5 border-b border-line last:border-b-0">
            <span className="w-9 shrink-0 font-mono text-sm text-muted tabular-nums">#{r.rank}</span>
            <span className="flex-1 min-w-0 truncate font-display text-[1.7rem] font-bold leading-none text-gold">{r.name}</span>
            <span className="font-mono text-lg font-bold tabular-nums">{r.score.toFixed(2)}</span>
          </li>
        ))}
      </ol>
    </Card>
  );
}

function Stories() {
  const [full, setFull] = useState(false);
  return (
    <Card id="stories" title="Top Stories" footer={<GoLink onClick={() => setFull(!full)}>{full ? "Show short previews" : "Read full stories"}</GoLink>}>
      <ul className="slim max-h-[26rem] overflow-y-auto pr-1 divide-y divide-line">
        {STORIES.map((s) => (
          <li key={s.title} className="py-4 first:pt-0">
            <div className="flex items-start justify-between gap-3">
              <h3 className="font-display text-2xl font-bold leading-tight">{s.title}</h3>
              <span className={`shrink-0 border rounded-full px-3 py-0.5 text-xs font-medium ${s.status === "Active" ? "border-accent text-accent" : "border-line text-muted"}`}>{s.status}</span>
            </div>
            <p className={`mt-2 text-fg leading-snug ${full ? "" : "line-clamp-2"}`}>{s.text}</p>
            <p className="mt-2 flex flex-wrap gap-x-3 text-sm font-medium text-accent">{s.people.map((n) => <span key={n}>{n}</span>)}</p>
          </li>
        ))}
      </ul>
    </Card>
  );
}

function Events({ events, onCreate, onRemove, onCalendar }) {
  return (
    <Card id="events" title="Upcoming Special Event" footer={<GoLink onClick={onCalendar}>Go to Calendar</GoLink>}>
      <div className="flex-1 min-h-[16rem] rounded-lg bg-panel border border-line p-4 flex flex-col">
        {events.length === 0 ? (
          <div className="flex-1 grid place-content-center justify-items-center gap-4 text-center">
            <p className="text-muted">No upcoming special events.</p>
            <button onClick={onCreate} className="bg-accent text-accentfg px-6 py-3 rounded-md font-semibold shadow-lg hover:brightness-110 active:brightness-90 active:scale-[.98] transition">Create Special Event</button>
          </div>
        ) : (
          <>
            <ul className="slim flex-1 max-h-[20rem] overflow-y-auto space-y-3 pr-1">
              {events.map((e) => (
                <li key={e.id} className="flex items-start gap-3 border border-line rounded-lg bg-card p-3">
                  <span className="shrink-0 w-14 text-center bg-accent text-accentfg py-1.5 font-display leading-none">
                    <span className="block text-2xl font-extrabold tabular-nums">{e.date.slice(8, 10)}</span>
                    <span className="block text-xs font-bold uppercase tracking-wider">{new Date(e.date + "T00:00:00").toLocaleDateString("en-GB", { month: "short" })}</span>
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block font-display text-xl font-bold leading-tight">{e.name}</span>
                    <span className="block text-sm text-muted">{e.venue || "Venue to be announced"} · {fmtDate(e.date)}</span>
                  </span>
                  <button onClick={() => onRemove(e.id)} aria-label={`Remove ${e.name}`} className="p-1.5 text-muted hover:text-heel transition-colors"><Icon d={I.trash} size={18} /></button>
                </li>
              ))}
            </ul>
            <button onClick={onCreate} className="mt-4 w-full border border-accent text-accent py-2.5 rounded-md font-semibold hover:bg-accent hover:text-accentfg transition-colors">Create Special Event</button>
          </>
        )}
      </div>
    </Card>
  );
}

/* ---------- Dialogs ---------- */
function Modal({ label, onClose, children, wide }) {
  const ref = useRef(null);
  useEffect(() => {
    const prevFocus = document.activeElement;
    ref.current && ref.current.focus();
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = prev; prevFocus && prevFocus.focus && prevFocus.focus(); };
  }, []);
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div ref={ref} tabIndex={-1} role="dialog" aria-modal="true" aria-label={label} className={`rise relative w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[92dvh] overflow-y-auto card p-5 sm:p-7 outline-none`}>
        <button onClick={onClose} aria-label="Close" className="absolute top-3 right-3 grid place-items-center h-10 w-10 hover:bg-accent hover:text-accentfg transition-colors"><Icon d={I.close} /></button>
        {children}
      </div>
    </div>
  );
}

function EventForm({ onSave, onClose }) {
  const today = iso(new Date());
  const [f, setF] = useState({ name: "", date: "", venue: "" });
  const [err, setErr] = useState({});
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!f.name.trim()) er.name = "Enter a name for the event.";
    if (!f.date) er.date = "Choose a date.";
    else if (f.date < today) er.date = "Choose today or a future date.";
    setErr(er);
    if (Object.keys(er).length) return;
    onSave({ id: Date.now().toString(36), name: f.name.trim(), date: f.date, venue: f.venue.trim() });
  };
  const field = "w-full bg-bg border px-3 py-2.5 text-base focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors";
  return (
    <Modal label="Create special event" onClose={onClose}>
      <h2 className="font-display text-3xl font-bold uppercase tracking-[0.12em] pr-10">Create Special Event</h2>
      <span className="block mt-3 mb-5 h-[3px] w-12 bg-accent" />
      <form onSubmit={submit} noValidate className="space-y-4">
        <div>
          <label htmlFor="ev-name" className="block text-sm font-medium mb-1">Event name</label>
          <input id="ev-name" value={f.name} onChange={set("name")} placeholder="Backyard Mania 2026" aria-invalid={!!err.name} className={`${field} ${err.name ? "border-heel" : "border-line"}`} />
          {err.name && <p className="mt-1 text-sm text-heel">{err.name}</p>}
        </div>
        <div className="grid gap-4 sm:grid-cols-2">
          <div>
            <label htmlFor="ev-date" className="block text-sm font-medium mb-1">Date</label>
            <input id="ev-date" type="date" min={today} value={f.date} onChange={set("date")} aria-invalid={!!err.date} className={`${field} ${err.date ? "border-heel" : "border-line"}`} />
            {err.date && <p className="mt-1 text-sm text-heel">{err.date}</p>}
          </div>
          <div>
            <label htmlFor="ev-venue" className="block text-sm font-medium mb-1">Venue <span className="text-muted font-normal">(optional)</span></label>
            <input id="ev-venue" value={f.venue} onChange={set("venue")} placeholder="Johannesburg Arena" className={`${field} border-line`} />
          </div>
        </div>
        <div className="flex gap-3 pt-2">
          <button type="submit" className="flex-1 bg-accent text-accentfg py-3 rounded-md font-semibold hover:brightness-110 active:brightness-90 transition">Save event</button>
          <button type="button" onClick={onClose} className="px-5 py-3 rounded-md border border-line text-muted hover:text-fg hover:border-fg transition-colors">Cancel</button>
        </div>
      </form>
    </Modal>
  );
}

function CalendarDialog({ events, onClose }) {
  const now = new Date();
  const [cursor, setCursor] = useState(new Date(now.getFullYear(), now.getMonth(), 1));
  const [sel, setSel] = useState(iso(now));
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const count = new Date(y, m + 1, 0).getDate();
  const cells = [...Array(lead).fill(null), ...Array.from({ length: count }, (_, i) => i + 1)];
  const key = (d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const byDate = {};
  events.forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const move = (n) => setCursor(new Date(y, m + n, 1));
  const todays = byDate[sel] || [];
  return (
    <Modal label="Event calendar" onClose={onClose} wide>
      <h2 className="font-display text-3xl font-bold uppercase tracking-[0.12em] pr-10">Calendar</h2>
      <span className="block mt-3 mb-5 h-[3px] w-12 bg-accent" />
      <div className="flex items-center justify-between mb-3">
        <button onClick={() => move(-1)} aria-label="Previous month" className="grid place-items-center h-10 w-10 border border-line hover:border-accent hover:text-accent transition-colors"><Icon d={I.left} /></button>
        <p className="font-display text-2xl font-bold uppercase tracking-wider" aria-live="polite">{cursor.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</p>
        <button onClick={() => move(1)} aria-label="Next month" className="grid place-items-center h-10 w-10 border border-line hover:border-accent hover:text-accent transition-colors"><Icon d={I.right} /></button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center">
        {["M", "T", "W", "T", "F", "S", "S"].map((d, i) => <span key={i} className="py-1 text-xs font-semibold uppercase tracking-wider text-muted">{d}</span>)}
        {cells.map((d, i) => {
          if (!d) return <span key={i} />;
          const k = key(d), has = byDate[k], on = k === sel, isToday = k === iso(now);
          return (
            <button key={i} onClick={() => setSel(k)} aria-pressed={on} aria-label={`${fmtDate(k)}${has ? `, ${has.length} event${has.length > 1 ? "s" : ""}` : ""}`}
              className={`relative aspect-square grid place-items-center text-base tabular-nums border transition-colors ${on ? "bg-accent text-accentfg border-accent font-bold" : isToday ? "border-accent text-accent" : "border-transparent hover:border-line"}`}>
              {d}
              {has && <span className={`absolute bottom-1.5 h-1.5 w-1.5 rounded-full ${on ? "bg-accentfg" : "bg-gold"}`} />}
            </button>
          );
        })}
      </div>
      <div className="mt-5 border-t border-line pt-4">
        <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-2">{fmtDate(sel)}</h3>
        {todays.length ? (
          <ul className="space-y-1.5">{todays.map((e) => <li key={e.id}><span className="font-medium">{e.name}</span> <span className="text-muted">· {e.venue || "Venue to be announced"}</span></li>)}</ul>
        ) : <p className="text-muted">No events on this day.</p>}
      </div>
    </Modal>
  );
}

/* ---------- Footer ---------- */
function Footer() {
  return (
    <footer className="mt-20 bg-nav text-navfg border-t border-line">
      <div className="gut">
        <div className="cap py-12 grid gap-10 grid-cols-2 md:grid-cols-5">
          {Object.entries(FOOT).map(([h, links]) => (
            <div key={h}>
              <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-3">{h}</h3>
              <ul className="space-y-2">
                {links.map((l) => <li key={l}><a href="#" onClick={(e) => e.preventDefault()} className="text-sm text-[#9aa79c] hover:text-white transition-colors">{l}</a></li>)}
              </ul>
            </div>
          ))}
          <div className="col-span-2 md:col-span-1">
            <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-3">Global Sites</h3>
            <p className="text-sm text-[#9aa79c]">Available in English, Spanish and Arabic.</p>
          </div>
        </div>
        <div className="cap border-t border-line py-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <span className="flex items-center gap-2 font-display text-2xl font-extrabold tracking-wide"><span className="inline-block h-5 w-2 -skew-x-12 bg-accent" aria-hidden="true" />BCW</span>
          <p className="text-xs text-[#9aa79c]">© BCW. All rights reserved.</p>
        </div>
      </div>
    </footer>
  );
}

/* ---------- App ---------- */
function App() {
  const [events, setEvents] = useState(loadEvents);
  const [dialog, setDialog] = useState(null);
  const today = iso(new Date());
  const upcoming = useMemo(() => events.filter((e) => e.date >= today).sort((a, b) => a.date.localeCompare(b.date)), [events]);

  const update = (list) => { setEvents(list); saveEvents(list); };
  const toggleTheme = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  };

  return (
    <>
      <Header onToggleTheme={toggleTheme} />
      <main>
        <Band upcoming={upcoming.length} />
        <div className="gut">
          <div className="cap py-8 sm:py-10 space-y-5 sm:space-y-6">
            <div className="grid gap-5 sm:gap-6 lg:grid-cols-2">
              <RosterSnapshot />
              <Divisions />
            </div>
            <div className="grid gap-5 sm:gap-6 md:grid-cols-2 xl:grid-cols-4">
              <Champions />
              <Rankings />
              <Stories />
              <Events events={upcoming} onCreate={() => setDialog("form")} onRemove={(id) => update(events.filter((e) => e.id !== id))} onCalendar={() => setDialog("calendar")} />
            </div>
          </div>
        </div>
      </main>
      <Footer />
      {dialog === "form" && <EventForm onClose={() => setDialog(null)} onSave={(ev) => { update([...events, ev]); setDialog(null); }} />}
      {dialog === "calendar" && <CalendarDialog events={events} onClose={() => setDialog(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
