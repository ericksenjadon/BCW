<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BCW Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  /* Layout concept: black broadcast nav, diagonal-striped title band, a championships grid, then a filterable roster of competitor cards that open into full profiles. Main colour is green. */
  :root {
    --bg: #0a0d0b;
    --panel: #121713;
    --panel2: #1a211b;
    --line: #29322b;
    --fg: #f1f5f1;
    --muted: #9aa79c;
    --accent: #22c55e;
    --accentfg: #04130a;
    --nav: #040605;
    --navfg: #f1f5f1;
    --heel: #f2685b;
    --face: #4cc3ff;
    --tween: #f5b73d;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f5f1; --panel: #ffffff; --panel2: #e6ece5; --line: #cfd8cd;
      --fg: #0f1511; --muted: #526055; --accent: #15803d; --accentfg: #ffffff;
      --heel: #c2362a; --face: #0a74b8; --tween: #a8680a;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f5f1; --panel: #ffffff; --panel2: #e6ece5; --line: #cfd8cd;
    --fg: #0f1511; --muted: #526055; --accent: #15803d; --accentfg: #ffffff;
    --heel: #c2362a; --face: #0a74b8; --tween: #a8680a;
    color-scheme: light;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; margin: 0; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cap { max-width: 1320px; margin-left: auto; margin-right: auto; }
  .stripes { background-image: repeating-linear-gradient(115deg, transparent 0 26px, color-mix(in srgb, var(--accent) 14%, transparent) 26px 30px); }
  .noscroll { scrollbar-width: none; }
  .noscroll::-webkit-scrollbar { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 0.28s ease-out both; }
</style>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { bg: "var(--bg)", panel: "var(--panel)", panel2: "var(--panel2)", line: "var(--line)", fg: "var(--fg)", muted: "var(--muted)", accent: "var(--accent)", accentfg: "var(--accentfg)", nav: "var(--nav)", navfg: "var(--navfg)", heel: "var(--heel)", face: "var(--face)", tween: "var(--tween)" },
      fontFamily: { display: "var(--font-display)", body: "var(--font-body)" }
    } }
  };
</script>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- Roster data ----------*/

const ROSTER = [
  {
    name: "Nehemiah", status: "Active", alignment: "heel", brand: "BCW", hue: 148,
    record: { w: 8, l: 4, d: 0 },
    current: ["BCW World Heavyweight Championship", "Undisputed World Championship"],
    ranked: [],
    legacy: [[3, "Undisputed World Championship"], [2, "Men's Scramble Battle Winner"], [1, "BCW World Heavyweight Championship"], [1, "BCW Tag Team Championship"], [1, "24/7 Championship"]],
  },
  {
    name: "Malcolm", status: "Active", alignment: "face", brand: "BCW", hue: 165,
    record: { w: 5, l: 3, d: 0 },
    current: ["BCW Tag Team Championship"],
    ranked: [{ rank: 1, division: "Undisputed Championship", title: "Undisputed World Championship" }],
    legacy: [[2, "BCW World Heavyweight Championship"], [1, "Undisputed World Championship"], [1, "BCW Tag Team Championship"], [1, "Men's Scramble Battle Winner"]],
  },
  {
    name: "Caleb", status: "Active", alignment: "tween", brand: "BCW", hue: 135,
    record: { w: 2, l: 1, d: 0 },
    current: ["Men's Rumble Winner"],
    ranked: [{ rank: 1, division: "BCW World Championship", title: "BCW World Heavyweight Championship" }],
    legacy: [[1, "Undisputed World Championship"], [1, "BCW Tag Team Championship"], [1, "24/7 Championship"], [1, "Men's Scramble Battle Winner"]],
  },
  {
    name: "Justin", status: "Active", alignment: "tween", brand: "BCW", hue: 175,
    record: { w: 2, l: 3, d: 0 },
    current: ["BCW Tag Team Championship"],
    ranked: [{ rank: 2, division: "BCW World Championship", title: "BCW World Heavyweight Championship" }],
    legacy: [[2, "BCW Tag Team Championship"], [1, "BCW World Heavyweight Championship"]],
  },
  {
   name: "Pebble", status: "Active", alignment: "face", brand: "BCW", hue: 175,
    record: { w: 2, l: 3, d: 0 },
    current: [],
    ranked: [{ rank: 2, division: "BCW World Championship", title: "BCW World Heavyweight Championship" }],
    legacy: [[2, "BCW Tag Team Championship"], [1, "BCW World Heavyweight Championship"]],
  },
  {
   name: "Deowin", status: "Active", alignment: "heel", brand: "BCW", hue: 175,
    record: { w: 1, l: 3, d: 0 },
    current: [],
    ranked: [{ rank: 2, division: "BCW Tag Team Championship", title: "BCW World Heavyweight Championship" }],
    legacy: [[1, "BCW Tag Team Championship"], [1, "24/7 Championship"]],
  },
].map((p) => {
  const total = p.record.w + p.record.l + p.record.d;
  return { ...p, id: p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-"), winRate: total ? Math.round((p.record.w / total) * 100) : 0, reigns: p.legacy.reduce((n, [c]) => n + c, 0) };
});

const ALIGN = { heel: "Heel", face: "Face", tween: "Tween" };

// Championship table is derived from the roster, so it stays in sync as you add people.
const TITLES = (() => {
  const names = [];
  ROSTER.forEach((p) => [...p.current, ...p.legacy.map((l) => l[1])].forEach((t) => { if (!names.includes(t)) names.push(t); }));
  return names.map((name) => {
    const holders = ROSTER.filter((p) => p.current.includes(name)).map((p) => p.name);
    const past = ROSTER.reduce((n, p) => n + (p.legacy.find((l) => l[1] === name) || [0])[0], 0);
    return { name, holders, past };
  }).sort((a, b) => b.holders.length - a.holders.length);
})();

const FILTERS = [
  { id: "all", label: "All Competitors", test: () => true },
  { id: "active", label: "Active", test: (p) => p.status === "Active" },
  { id: "champions", label: "Champions", test: (p) => p.current.length > 0 },
  { id: "heel", label: "Heels", test: (p) => p.alignment === "heel" },
  { id: "face", label: "Faces", test: (p) => p.alignment === "face" },
  { id: "tween", label: "Tweens", test: (p) => p.alignment === "tween" },
];
const SORTS = [
  { id: "az", label: "Name A to Z", fn: (a, b) => a.name.localeCompare(b.name) },
  { id: "za", label: "Name Z to A", fn: (a, b) => b.name.localeCompare(a.name) },
  { id: "win", label: "Win rate", fn: (a, b) => b.winRate - a.winRate || a.name.localeCompare(b.name) },
];
const PAGE = 24;
const NAV = ["Shows", "Roster", "Tickets", "Podcasts", "Shop", "Club BCW"];
const STREAMS = [
  ["BCW Network", "Every premium live event, plus the full archive, on any device."],
  ["Arena+", "Weekly shows live in your region with replays for 30 days."],
  ["How to Watch", "Find where each show and event streams in your country."],
];
const FOOT = {
  Corporate: ["Corporate", "Careers", "Impact"],
  "BCW.com": ["News", "Videos", "Photos", "Priority Pass"],
  About: ["Terms of Use", "Privacy Policy", "Copyright", "Your Privacy Choices"],
  Help: ["Club FAQs", "Contact Us", "Security", "Cookie Policy"],
};

/* ---------- Icons ---------- */
const Icon = ({ d, size = 20, className = "", fill = "none" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true"><path d={d} /></svg>
);
const I = {
  search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3",
  menu: "M4 6h16M4 12h16M4 18h16",
  close: "M18 6 6 18M6 6l12 12",
  right: "M9 18l6-6-6-6",
  heart: "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z",
  down: "M6 9l6 6 6-6",
  sun: "M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  play: "M6 4l14 8-14 8z",
};

/* ---------- Shared pieces ---------- */
function Portrait({ p, className = "" }) {
  if (p.photo) return <img src={p.photo} alt={p.name} className={`object-cover ${className}`} />;
  return (
    <div className={`relative overflow-hidden ${className}`} style={{ background: `linear-gradient(165deg, hsl(${p.hue} 45% 30%), hsl(${p.hue} 50% 7%))` }}>
      <span className="absolute -right-2 top-0 font-display font-extrabold leading-none select-none" style={{ fontSize: "9rem", color: "rgba(255,255,255,.12)" }}>{p.name[0]}</span>
      <svg viewBox="0 0 100 120" className="absolute bottom-0 left-0 w-full h-[78%]" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <circle cx="50" cy="46" r="19" fill="rgba(0,0,0,.55)" />
        <path d="M6 120c0-32 19-46 44-46s44 14 44 46z" fill="rgba(0,0,0,.55)" />
      </svg>
    </div>
  );
}

function AlignPill({ a }) {
  return <span className={`inline-block border px-2 py-0.5 font-display text-sm font-bold uppercase tracking-wider text-${a} border-${a}`}>{ALIGN[a]}</span>;
}

function WinBar({ rate }) {
  return (
    <div className="flex items-center gap-2">
      <div className="h-1.5 flex-1 bg-panel2 overflow-hidden" role="img" aria-label={`Win rate ${rate} percent`}>
        <div className="h-full bg-accent" style={{ width: `${rate}%` }} />
      </div>
      <span className="font-display text-lg font-bold tabular-nums leading-none">{rate}%</span>
    </div>
  );
}

function Belt({ active }) {
  return (
    <svg viewBox="0 0 120 70" className="w-20 h-12 shrink-0" aria-hidden="true">
      <rect x="2" y="14" width="116" height="42" rx="8" fill={active ? "var(--nav)" : "var(--panel2)"} stroke="var(--line)" />
      <rect x="2" y="14" width="22" height="42" rx="6" fill={active ? "var(--accent)" : "var(--line)"} opacity=".85" />
      <rect x="96" y="14" width="22" height="42" rx="6" fill={active ? "var(--accent)" : "var(--line)"} opacity=".85" />
      <circle cx="60" cy="35" r="24" fill={active ? "var(--accent)" : "var(--muted)"} stroke="rgba(0,0,0,.4)" strokeWidth="2" />
      <circle cx="60" cy="35" r="16" fill="none" stroke="rgba(0,0,0,.35)" strokeWidth="2" />
      <path d="M60 24l3.4 7 7.6 1-5.5 5.3 1.3 7.7L60 41.4l-6.8 3.6 1.3-7.7-5.5-5.3 7.6-1z" fill="rgba(0,0,0,.45)" />
    </svg>
  );
}

/* ---------- Header ---------- */
function Header({ onToggleTheme, onOpenSearch }) {
  const [menu, setMenu] = useState(false);
  const [watch, setWatch] = useState(false);
  const watchRef = useRef(null);
  useEffect(() => {
    if (!watch) return;
    const close = (e) => { if (watchRef.current && !watchRef.current.contains(e.target)) setWatch(false); };
    const esc = (e) => { if (e.key === "Escape") setWatch(false); };
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, [watch]);
  const stop = (e) => e.preventDefault();
  return (
    <header className="sticky z-50 bg-nav text-navfg border-b border-line" style={{ top: "env(safe-area-inset-top, 0px)" }}>
      <div className="gut">
        <div className="cap flex h-16 items-center gap-4">
          <button className="lg:hidden -ml-2 p-2 rounded hover:bg-white/10 transition-colors" aria-label={menu ? "Close menu" : "Open menu"} aria-expanded={menu} onClick={() => setMenu(!menu)}>
            <Icon d={menu ? I.close : I.menu} size={24} />
          </button>
          <a href="#" onClick={stop} className="flex items-center gap-2 font-display text-[2.1rem] font-extrabold tracking-wide leading-none" aria-label="BCW home">
            <span className="inline-block h-6 w-2.5 -skew-x-12 bg-accent" aria-hidden="true" />BCW
          </a>
          <nav aria-label="Main" className="hidden lg:flex items-center gap-1 ml-6">
            {NAV.map((n) => {
              const on = n === "Roster";
              return (
                <a key={n} href="#" onClick={stop} aria-current={on ? "page" : undefined}
                  className={`relative px-3 py-2 font-display text-lg font-semibold uppercase tracking-wide transition-colors hover:text-accent ${on ? "text-accent" : ""}`}>
                  {n}
                  {on && <span className="absolute left-3 right-3 -bottom-[13px] h-[3px] bg-accent" />}
                </a>
              );
            })}
          </nav>
          <div className="ml-auto flex items-center gap-1 sm:gap-2">
            <div className="relative" ref={watchRef}>
              <button onClick={() => setWatch(!watch)} aria-expanded={watch} aria-haspopup="true"
                className="flex items-center gap-1.5 rounded-sm bg-accent text-accentfg px-3 sm:px-4 py-2 font-display font-bold uppercase tracking-wide text-base hover:brightness-110 active:brightness-90 transition">
                <Icon d={I.play} size={14} fill="currentColor" /> Watch <Icon d={I.down} size={16} className={`transition-transform ${watch ? "rotate-180" : ""}`} />
              </button>
              {watch && (
                <div className="rise absolute right-0 mt-3 w-[min(92vw,22rem)] bg-panel text-fg border border-line shadow-2xl rounded-sm p-2">
                  {STREAMS.map(([t, d]) => (
                    <a key={t} href="#" onClick={stop} className="block p-3 rounded-sm hover:bg-panel2 focus-visible:bg-panel2 transition-colors">
                      <span className="block font-display text-xl font-bold uppercase">{t}</span>
                      <span className="block text-sm text-muted">{d}</span>
                    </a>
                  ))}
                </div>
              )}
            </div>
            <button onClick={onOpenSearch} aria-label="Search the roster" className="p-2 rounded hover:bg-white/10 transition-colors hover:text-accent"><Icon d={I.search} size={22} /></button>
            <button onClick={onToggleTheme} aria-label="Switch light or dark theme" className="hidden sm:block p-2 rounded hover:bg-white/10 transition-colors hover:text-accent"><Icon d={I.sun} size={22} /></button>
          </div>
        </div>
      </div>
      {menu && (
        <nav aria-label="Mobile" className="lg:hidden border-t border-line bg-nav rise">
          <div className="gut">
            <ul className="cap py-2">
              {NAV.map((n) => (
                <li key={n}>
                  <a href="#" onClick={stop} className={`flex items-center justify-between py-3 border-b border-line font-display text-2xl font-semibold uppercase ${n === "Roster" ? "text-accent" : ""}`}>
                    {n}<Icon d={I.right} size={18} />
                  </a>
                </li>
              ))}
              <li><button onClick={onToggleTheme} className="sm:hidden w-full text-left py-3 font-display text-2xl font-semibold uppercase">Switch theme</button></li>
            </ul>
          </div>
        </nav>
      )}
    </header>
  );
}

/* ---------- Hero ---------- */
function Hero() {
  const champs = ROSTER.filter((p) => p.current.length).length;
  return (
    <section className="stripes border-b border-line bg-panel">
      <div className="gut">
        <div className="cap py-10 sm:py-14 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p className="font-display text-lg font-semibold uppercase tracking-[0.2em] text-accent">BCW</p>
            <h1 className="font-display text-6xl sm:text-8xl font-extrabold uppercase leading-[0.9] tracking-tight" style={{ textWrap: "balance" }}>Roster</h1>
          </div>
          <div className="flex gap-6 font-display uppercase">
            {[[ROSTER.length, "Competitors"], [champs, "Champions"], [TITLES.length, "Titles"]].map(([n, l]) => (
              <div key={l}>
                <p className="text-5xl font-extrabold leading-none tabular-nums">{n}</p>
                <p className="text-sm tracking-widest text-muted">{l}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- Championships ---------- */
function TitleCard({ t }) {
  const held = t.holders.length > 0;
  return (
    <div className="flex items-center gap-4 border border-line bg-panel p-4 hover:border-accent hover:-translate-y-0.5 transition-all duration-200">
      <Belt active={held} />
      <div className="min-w-0">
        <h3 className="font-display text-xl sm:text-2xl font-bold uppercase leading-tight">{t.name}</h3>
        <p className="mt-1 text-sm">
          <span className="text-muted">{held ? (t.holders.length > 1 ? "Champions: " : "Champion: ") : ""}</span>
          <span className="font-medium">{held ? t.holders.join(" & ") : "No current holder"}</span>
        </p>
        <p className="text-xs uppercase tracking-wider text-muted tabular-nums">{t.past} past {t.past === 1 ? "reign" : "reigns"} on the roster</p>
      </div>
    </div>
  );
}

function Championships() {
  return (
    <section aria-labelledby="titles-h">
      <h2 id="titles-h" className="font-display text-4xl sm:text-5xl font-extrabold uppercase mb-5">Championships</h2>
      <div className="grid gap-3 grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
        {TITLES.map((t) => <TitleCard key={t.name} t={t} />)}
      </div>
    </section>
  );
}

/* ---------- Roster ---------- */
function CompetitorCard({ p, fav, onOpen, onFav }) {
  const { w, l, d } = p.record;
  return (
    <li className="relative group rise">
      <button onClick={() => onOpen(p)} className="block w-full text-left focus-visible:outline-offset-4">
        <div className="relative overflow-hidden border border-line">
          <Portrait p={p} className="aspect-[3/4] w-full transition-transform duration-500 group-hover:scale-105" />
          {p.current.length > 0 && (
            <span className="absolute left-2 top-2 bg-accent text-accentfg px-2 py-0.5 font-display text-sm font-bold uppercase tracking-wider">
              {p.current.length > 1 ? `${p.current.length}× Champion` : "Champion"}
            </span>
          )}
          <span className="absolute inset-x-0 bottom-0 grid place-items-center h-9 bg-accent text-accentfg font-display font-bold uppercase tracking-wide translate-y-full group-hover:translate-y-0 group-focus-visible:translate-y-0 transition-transform duration-200">View profile</span>
        </div>
        <div className="mt-3 flex items-center justify-between gap-2">
          <p className="font-display text-3xl font-extrabold uppercase leading-none group-hover:text-accent transition-colors truncate">{p.name}</p>
          <AlignPill a={p.alignment} />
        </div>
        <p className="mt-1 text-xs uppercase tracking-wider text-muted">{p.brand} · {p.status}</p>
        <p className="mt-2 font-display text-lg font-semibold uppercase tabular-nums">{w}W <span className="text-muted">·</span> {l}L <span className="text-muted">·</span> {d}D</p>
        <div className="mt-1"><WinBar rate={p.winRate} /></div>
      </button>
      <button onClick={() => onFav(p.id)} aria-pressed={fav} aria-label={`${fav ? "Remove" : "Add"} ${p.name} ${fav ? "from" : "to"} favorites`}
        className={`absolute top-2 right-2 grid place-items-center h-9 w-9 rounded-full bg-black/60 text-white backdrop-blur transition-all hover:bg-accent hover:text-accentfg ${fav ? "opacity-100" : "sm:opacity-0 group-hover:opacity-100 focus-visible:opacity-100"}`}>
        <Icon d={I.heart} size={18} fill={fav ? "currentColor" : "none"} className={fav ? "text-accent" : ""} />
      </button>
    </li>
  );
}

function Roster({ favs, onOpen, onFav, searchRef, query, setQuery }) {
  const [pending, setPending] = useState("all");
  const [applied, setApplied] = useState("all");
  const [onlyFavs, setOnlyFavs] = useState(false);
  const [sort, setSort] = useState("az");
  const [shown, setShown] = useState(PAGE);

  const filtered = useMemo(() => {
    const test = FILTERS.find((f) => f.id === applied).test;
    const q = query.trim().toLowerCase();
    return ROSTER.filter((p) => test(p) && (!q || p.name.toLowerCase().includes(q)) && (!onlyFavs || favs.has(p.id)))
      .sort(SORTS.find((s) => s.id === sort).fn);
  }, [applied, query, onlyFavs, sort, favs]);

  useEffect(() => setShown(PAGE), [applied, query, onlyFavs, sort]);
  const visible = filtered.slice(0, shown);
  const dirty = pending !== applied;
  const clear = () => { setPending("all"); setApplied("all"); setQuery(""); setOnlyFavs(false); };

  return (
    <section id="roster" aria-labelledby="roster-h" className="mt-14 scroll-mt-24">
      <h2 id="roster-h" className="font-display text-4xl sm:text-5xl font-extrabold uppercase mb-5">Competitors</h2>

      <div className="border border-line bg-panel p-4 sm:p-5">
        <div className="flex flex-col gap-4 lg:flex-row lg:items-center">
          <div role="radiogroup" aria-label="Filter competitors" className="noscroll flex gap-2 overflow-x-auto lg:flex-wrap pb-1 lg:pb-0 flex-1 min-w-0">
            {FILTERS.map((f) => {
              const on = pending === f.id;
              return (
                <button key={f.id} role="radio" aria-checked={on} onClick={() => setPending(f.id)}
                  className={`shrink-0 px-3.5 py-1.5 border font-display text-lg font-semibold uppercase tracking-wide transition-colors ${on ? "bg-fg text-bg border-fg" : "border-line text-muted hover:text-fg hover:border-fg"}`}>
                  {f.label}
                </button>
              );
            })}
          </div>
          <button onClick={() => setApplied(pending)} disabled={!dirty}
            className="shrink-0 px-6 py-2 bg-accent text-accentfg font-display text-lg font-bold uppercase tracking-wide hover:brightness-110 active:brightness-90 disabled:opacity-40 disabled:pointer-events-none transition">
            Apply
          </button>
        </div>
        <div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center">
          <label htmlFor="q" className="sr-only">Search competitors by name</label>
          <div className="relative flex-1 min-w-0">
            <Icon d={I.search} size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted" />
            <input id="q" ref={searchRef} value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search by name"
              className="w-full bg-bg border border-line pl-10 pr-3 py-2.5 text-base placeholder:text-muted focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors" />
          </div>
          <div className="flex gap-2">
            <label htmlFor="sort" className="sr-only">Sort competitors</label>
            <select id="sort" value={sort} onChange={(e) => setSort(e.target.value)}
              className="bg-bg border border-line px-3 py-2.5 text-sm font-medium text-fg focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors">
              {SORTS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <button onClick={() => setOnlyFavs(!onlyFavs)} aria-pressed={onlyFavs}
              className={`flex items-center gap-2 px-3.5 py-2.5 border text-sm font-medium transition-colors ${onlyFavs ? "border-accent text-accent" : "border-line text-muted hover:text-fg hover:border-fg"}`}>
              <Icon d={I.heart} size={16} fill={onlyFavs ? "currentColor" : "none"} /> Favorites ({favs.size})
            </button>
          </div>
        </div>
      </div>

      <p className="mt-4 mb-5 text-sm text-muted tabular-nums" aria-live="polite">
        Showing {visible.length} of {filtered.length} {filtered.length === 1 ? "competitor" : "competitors"}
        {dirty && <span className="ml-2 text-accent">Filter changed. Select Apply to update.</span>}
      </p>

      {filtered.length === 0 ? (
        <div className="border border-dashed border-line p-10 text-center">
          <p className="font-display text-3xl font-bold uppercase">No competitors match</p>
          <p className="text-muted mt-1 mb-4">Try a different name or filter.</p>
          <button onClick={clear} className="px-5 py-2 border border-fg font-display text-lg font-semibold uppercase hover:bg-fg hover:text-bg transition-colors">Clear filters</button>
        </div>
      ) : (
        <ul className="grid grid-cols-1 min-[480px]:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-5 gap-y-9">
          {visible.map((p) => <CompetitorCard key={p.id} p={p} fav={favs.has(p.id)} onOpen={onOpen} onFav={onFav} />)}
        </ul>
      )}

      {visible.length < filtered.length && (
        <div className="mt-10 flex justify-center">
          <button onClick={() => setShown(shown + PAGE)} className="px-10 py-3 border border-fg font-display text-xl font-bold uppercase tracking-wide hover:bg-accent hover:border-accent hover:text-accentfg active:scale-[.98] transition-all">
            Load more
          </button>
        </div>
      )}
    </section>
  );
}

/* ---------- Profile dialog ---------- */
function Block({ title, children }) {
  return (
    <div className="border-t border-line pt-4 mt-5">
      <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-2">{title}</h3>
      {children}
    </div>
  );
}

function ProfileDialog({ p, fav, onFav, onClose }) {
  const closeRef = useRef(null);
  useEffect(() => {
    closeRef.current && closeRef.current.focus();
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = prev; };
  }, []);
  const rec = [["Wins", p.record.w], ["Losses", p.record.l], ["Draws", p.record.d]];
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div role="dialog" aria-modal="true" aria-label={`${p.name} profile`} className="rise relative w-full sm:max-w-3xl max-h-[92dvh] overflow-y-auto bg-panel border border-line grid sm:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]">
        <button ref={closeRef} onClick={onClose} aria-label="Close profile" className="absolute top-3 right-3 z-10 grid place-items-center h-10 w-10 bg-black/60 text-white hover:bg-accent hover:text-accentfg transition-colors"><Icon d={I.close} /></button>
        <Portrait p={p} className="aspect-[4/3] sm:aspect-auto sm:min-h-[26rem] w-full h-full" />
        <div className="p-5 sm:p-7 min-w-0">
          <div className="flex flex-wrap items-center gap-2">
            <span className="border border-accent text-accent px-2 py-0.5 font-display text-sm font-bold uppercase tracking-wider">{p.status}</span>
            <AlignPill a={p.alignment} />
            <span className="border border-line text-muted px-2 py-0.5 font-display text-sm font-bold uppercase tracking-wider">{p.brand}</span>
          </div>
          <h2 className="font-display text-6xl sm:text-7xl font-extrabold uppercase leading-[0.9] mt-2" style={{ textWrap: "balance" }}>{p.name}</h2>

          <div className="mt-5 grid grid-cols-3 gap-2">
            {rec.map(([k, v]) => (
              <div key={k} className="bg-panel2 p-3 text-center">
                <p className="font-display text-4xl font-extrabold leading-none tabular-nums">{v}</p>
                <p className="text-xs uppercase tracking-wider text-muted">{k}</p>
              </div>
            ))}
          </div>
          <div className="mt-3">
            <p className="text-xs uppercase tracking-wider text-muted mb-1">Win rate</p>
            <WinBar rate={p.winRate} />
          </div>

          <Block title="Current Championships">
            {p.current.length ? (
              <ul className="space-y-1.5">
                {p.current.map((c) => <li key={c} className="flex items-center gap-2 font-medium"><span className="h-2 w-2 bg-accent shrink-0" />{c}</li>)}
              </ul>
            ) : <p className="text-muted">No current championships.</p>}
          </Block>

          <Block title="Ranked Divisions">
            {p.ranked.length ? (
              <ul className="space-y-2">
                {p.ranked.map((r) => (
                  <li key={r.division} className="flex items-center gap-3">
                    <span className="grid place-items-center h-10 w-12 bg-accent text-accentfg font-display text-2xl font-extrabold tabular-nums">#{r.rank}</span>
                    <span className="min-w-0"><span className="block font-semibold leading-tight">{r.division}</span><span className="block text-sm text-muted leading-tight">{r.title}</span></span>
                  </li>
                ))}
              </ul>
            ) : <p className="text-muted">Not ranked in a division.</p>}
          </Block>

          <Block title="Championship Legacy">
            <ul className="space-y-1.5">
              {p.legacy.map(([n, t]) => (
                <li key={t} className="flex items-baseline gap-2">
                  <span className="font-display text-xl font-bold text-accent tabular-nums w-8 shrink-0">{n}×</span>
                  <span>{t}</span>
                </li>
              ))}
            </ul>
          </Block>

          <button onClick={() => onFav(p.id)} aria-pressed={fav}
            className={`mt-6 w-full flex items-center justify-center gap-2 px-5 py-3 font-display text-xl font-bold uppercase tracking-wide transition ${fav ? "border border-accent text-accent hover:bg-accent hover:text-accentfg" : "bg-accent text-accentfg hover:brightness-110 active:brightness-90"}`}>
            <Icon d={I.heart} size={18} fill={fav ? "currentColor" : "none"} /> {fav ? "Saved to favorites" : "Add to favorites"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Footer ---------- */
function Footer() {
  return (
    <footer className="mt-20 bg-nav text-navfg border-t border-line">
      <div className="gut">
        <div className="cap py-12 grid gap-10 grid-cols-2 md:grid-cols-5">
          {Object.entries(FOOT).map(([h, links]) => (
            <div key={h}>
              <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-3">{h}</h3>
              <ul className="space-y-2">
                {links.map((l) => <li key={l}><a href="#" onClick={(e) => e.preventDefault()} className="text-sm text-[#9aa79c] hover:text-white transition-colors">{l}</a></li>)}
              </ul>
            </div>
          ))}
          <div className="col-span-2 md:col-span-1">
            <h3 className="font-display text-xl font-bold uppercase tracking-wide mb-3">Global Sites</h3>
            <p className="text-sm text-[#9aa79c]">Available in English, Spanish and Arabic.</p>
          </div>
        </div>
        <div className="cap border-t border-line py-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <span className="flex items-center gap-2 font-display text-2xl font-extrabold tracking-wide"><span className="inline-block h-5 w-2 -skew-x-12 bg-accent" aria-hidden="true" />BCW</span>
          <p className="text-xs text-[#9aa79c]">© BCW. All rights reserved.</p>
        </div>
      </div>
    </footer>
  );
}

/* ---------- App ---------- */
function App() {
  const [favs, setFavs] = useState(() => new Set());
  const [open, setOpen] = useState(null);
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);

  const toggleFav = (id) => setFavs((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const toggleTheme = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  };
  const openSearch = () => {
    const el = document.getElementById("roster");
    el && el.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => searchRef.current && searchRef.current.focus(), 350);
  };
  const current = open ? ROSTER.find((s) => s.id === open) : null;

  return (
    <>
      <Header onToggleTheme={toggleTheme} onOpenSearch={openSearch} />
      <main>
        <Hero />
        <div className="gut">
          <div className="cap pt-12">
            <Championships />
            <Roster favs={favs} onOpen={(p) => setOpen(p.id)} onFav={toggleFav} searchRef={searchRef} query={query} setQuery={setQuery} />
          </div>
        </div>
      </main>
      <Footer />
      {current && <ProfileDialog p={current} fav={favs.has(current.id)} onFav={toggleFav} onClose={() => setOpen(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body></html>
